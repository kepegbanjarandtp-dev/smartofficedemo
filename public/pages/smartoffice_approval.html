<div class="smartoffice-approval-page">

  <!-- HEADER -->
  <div class="smartoffice-cuti-header">

    <div class="smartoffice-cuti-header-info">

      <button

        class="
          smartoffice-cuti-back-button
        "

        onclick="
          smartofficeLoadDashboardPage()
        "

      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="
            M15 18
            l-6-6
            6-6
          "/>

        </svg>

      </button>

      <div>

        <h2>
          Approval
        </h2>

        <p>
          Persetujuan pengajuan pegawai
        </p>

      </div>

    </div>

    <!-- REFRESH -->
    <button
      class="
        smartoffice-management-refresh-btn
      "
      onclick="
        smartofficeRefreshApproval()
      "
      title="Refresh Data"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path d="
          M21 12
          a9 9 0 1 1
          -3-6.7
        "/>

        <polyline points="
          21 3
          21 9
          15 9
        "/>

      </svg>

      <span>
        Refresh
      </span>

    </button>

  </div>

  <!-- TAB NAVIGATION -->
  <div class="smartoffice-approval-tab-container">

    <button
      id="smartofficeTabApprovalCuti"
      class="
        smartoffice-approval-tab-button
        active
      "
      onclick="smartofficeSwitchApprovalTab('cuti')"
    >
      Approval Cuti
    </button>

    <button
      id="smartofficeTabApprovalSpd"
      class="smartoffice-approval-tab-button"
      onclick="smartofficeSwitchApprovalTab('spd')"
    >
      Approval SPD
    </button>

  </div>

  <!-- APPROVAL CUTI -->
  <div id="smartofficeApprovalCutiContent">

    <div
      id="smartofficeApprovalCutiList"
      class="smartoffice-approval-list"
    >

      <div class="
        smartoffice-approval-skeleton-card
      "></div>

      <div class="
        smartoffice-approval-skeleton-card
      "></div>

      <div class="
        smartoffice-approval-skeleton-card
      "></div>

    </div>

  </div>

  <!-- APPROVAL SPD -->
  <div
    id="smartofficeApprovalSpdContent"
    style="display:none;"
  >

    <div class="smartoffice-empty-state">
      Belum ada approval SPD
    </div>

  </div>

</div>

<!-- APPROVAL DETAIL MODAL -->
<div
  id="smartofficeApprovalDetailModal"
  class="smartoffice-approval-detail-modal"
>

  <div class="smartoffice-approval-detail-content">

    <!-- HEADER -->
    <div class="smartoffice-approval-detail-header">

      <h3>
        Detail Approval
      </h3>

      <button
        class="smartoffice-approval-detail-close"
        onclick="smartofficeCloseApprovalDetail()"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="M18 6L6 18"/>

          <path d="M6 6l12 12"/>

        </svg>

      </button>

    </div>

    <!-- BODY -->
    <div id="smartofficeApprovalDetailBody"></div>

  </div>

</div>
